[package]
name = "peachy-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
peachy-document.workspace = true
peachy-engine.workspace = true
peachy-spine.workspace = true
peachy-io.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "io-util", "time"] }

[dev-dependencies]
rmcp = { version = "3.9", default-features = false, features = ["client", "server", "macros", "transport-io", "transport-child-process"] }

[lints]
workspace = true
