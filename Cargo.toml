[workspace]
members = ["crates/document", "crates/engine", "crates/spine", "crates/io", "apps/cli", "apps/desktop", "apps/mcp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
peachy-document = { path = "crates/document" }
peachy-engine = { path = "crates/engine" }
peachy-spine = { path = "crates/spine" }
peachy-io = { path = "crates/io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
