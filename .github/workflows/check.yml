name: Rust checks

# Run deliberately. Creating this project does not authorize spending changes or
# restarting workflows in Team Peachy's existing repositories.
on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: Focused Rust test name filter
        required: true
        type: string

env:
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "2"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libegl1-mesa-dev
      - run: cargo fmt --all -- --check
      - name: Run focused Rust checks
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          test -n "$TEST_FILTER"
          cargo test --workspace --locked -j 2 "$TEST_FILTER" -- --test-threads=2
      - run: python3 scripts/check-architecture.py
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
